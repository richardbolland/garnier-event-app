name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Served from https://hellostudiobo.github.io/garnier-event-app/
          # until a custom domain is attached (see README "Custom domain").
          # Set VITE_BASE_PATH="/" in repo Variables once a custom domain
          # + public/CNAME are in place.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/garnier-event-app/' }}
          VITE_SHEET_CSV_URL: ${{ secrets.VITE_SHEET_CSV_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
